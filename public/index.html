<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>draw.io — FynnCloud</title>
  <script src="app-bridge.global.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    html.dark, html.dark body {
      background-color: #121215;
    }
    #drawio-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      z-index: 10;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    html.dark .loading-overlay {
      background: rgba(18, 18, 21, 0.9);
      color: #f4f4f5;
    }
    .loading-overlay.hidden {
      opacity: 0;
      display: none;
    }
    .readonly-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .readonly-bar.visible {
      display: flex;
    }
    .readonly-badge {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(241, 245, 249, 0.92);
      color: #475569;
      border: 1px solid rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(8px);
      user-select: none;
    }
    html.dark .readonly-badge {
      background: rgba(39, 39, 42, 0.92);
      color: #a1a1aa;
      border-color: rgba(255, 255, 255, 0.12);
    }
    .readonly-close-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: background 0.15s ease;
    }
    .readonly-close-btn:hover {
      background: rgba(15, 23, 42, 1);
    }
    html.dark .readonly-close-btn {
      background: rgba(244, 244, 245, 0.92);
      color: #09090b;
      border-color: rgba(0, 0, 0, 0.12);
    }
    html.dark .readonly-close-btn:hover {
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">Loading draw.io...</div>
  <div id="readonly-bar" class="readonly-bar">
    <span class="readonly-badge">View only</span>
    <button id="readonly-close" type="button" class="readonly-close-btn" title="Close (Esc)">Close</button>
  </div>
  <iframe
    id="drawio-iframe"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>

  <script>
    const BLANK_DIAGRAM = `<mxfile host="app.diagrams.net"><diagram id="diagram" name="Page-1"><mxGraphModel dx="1422" dy="794" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="0" pageScale="1" pageWidth="1169" pageHeight="827" math="0" shadow="0"><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel></diagram></mxfile>`;

    const urlParams = new URLSearchParams(window.location.search);
    const isDark = urlParams.get('theme') === 'dark' || (urlParams.get('theme') !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);

    const DRAWIO_CONFIG = {
      defaultPageVisible: false,
      defaultGridEnabled: true,
      defaultGridSize: 10,
      defaultEdgeStyle: {
        edgeStyle: 'orthogonalEdgeStyle',
        rounded: '1',
        jettySize: 'auto',
        orthogonalLoop: '1'
      },
      defaultLibraries: 'general;flowchart;uml;arrows',
      presetColors: [
        '0F172A', '334155', '64748B', '94A3B8', 'CBD5E1', 'F1F5F9',
        '1E40AF', '2563EB', '3B82F6', '60A5FA', '93C5FD', 'DBEAFE',
        '065F46', '059669', '10B981', '34D399', '6EE7B7', 'D1FAE5',
        '92400E', 'D97706', 'F59E0B', 'FBBF24', 'FDE68A', 'FEF3C7',
        '991B1B', 'DC2626', 'EF4444', 'F87171', 'FCA5A5', 'FEE2E2',
        '5B21B6', '7C3AED', '8B5CF6', 'A78BFA', 'C4B5FD', 'EDE9FE'
      ],
      enableLightDarkColors: true,
      suppressNewWindows: true
    };

    let fileId = urlParams.get('fileId') || null;
    let fileName = urlParams.get('fileName') || urlParams.get('name') || 'Diagram.drawio';
    let isReadOnly = urlParams.get('readOnly') === '1' || urlParams.get('readOnly') === 'true';
    let currentXml = null;
    let drawioReady = false;
    let loading = false;
    let isSaving = false;
    let queuedXml = null;

    if (isDark) {
      document.documentElement.classList.add('dark');
    }

    const iframe = document.getElementById('drawio-iframe');
    const loadingEl = document.getElementById('loading');
    const readonlyBarEl = document.getElementById('readonly-bar');
    const readonlyCloseBtn = document.getElementById('readonly-close');

    readonlyCloseBtn.addEventListener('click', () => {
      window.fynncloud?.close?.();
    });

    window.addEventListener('keydown', (e) => {
      if (isReadOnly && e.key === 'Escape') {
        window.fynncloud?.close?.();
      }
    });

    function buildEditorUrl(readOnlyMode) {
      const editorUrl = new URL('editor/index.html', window.location.href);
      editorUrl.searchParams.set('embed', '1');
      editorUrl.searchParams.set('ui', 'atlas');
      editorUrl.searchParams.set('spin', '1');
      editorUrl.searchParams.set('proto', 'json');
      editorUrl.searchParams.set('configure', '1');
      editorUrl.searchParams.set('libraries', '1');
      editorUrl.searchParams.set('noSaveBtn', readOnlyMode ? '1' : '0');
      editorUrl.searchParams.set('saveAndExit', '0');
      editorUrl.searchParams.set('noExitBtn', '0');
      editorUrl.searchParams.set('stealth', '1');
      editorUrl.searchParams.set('dark', document.documentElement.classList.contains('dark') ? '1' : '0');
      if (readOnlyMode) {
        editorUrl.searchParams.set('chrome', '0');
      }
      return editorUrl.toString();
    }

    function applyReadOnlyMode(nextReadOnly) {
      const normalized = Boolean(nextReadOnly);
      readonlyBarEl.classList.toggle('visible', normalized);
      if (normalized !== isReadOnly) {
        isReadOnly = normalized;
        drawioReady = false;
        iframe.src = buildEditorUrl(isReadOnly);
      }
    }

    function detectReadOnly(payload) {
      if (!payload) return isReadOnly;
      if (typeof payload.readOnly === 'boolean') return payload.readOnly;
      if (typeof payload.fileAction?.readOnly === 'boolean') return payload.fileAction.readOnly;
      const f = payload.files?.[0] || payload.fileAction?.files?.[0];
      if (f?.permissions && typeof f.permissions.canWrite === 'boolean') {
        return !f.permissions.canWrite;
      }
      return isReadOnly;
    }

    function setFile(id, name) {
      if (name) fileName = name;
      document.title = `${fileName} — draw.io`;
      if (id && id !== fileId) {
        fileId = id;
        currentXml = null;
      }
      if (fileId && currentXml === null && !loading) {
        loadDiagram();
      }
    }

    function filesFrom(payload) {
      if (!payload) return null;
      const f = payload.files?.[0] || payload.fileAction?.files?.[0];
      if (f?.id) return { id: f.id, name: f.name || f.filename };
      if (payload.fileId) return { id: payload.fileId, name: payload.fileName };
      return null;
    }

    async function getAppToken() {
      if (window.fynncloud?.context?.token) return window.fynncloud.context.token;
      const res = await window.fynncloud?.getToken?.();
      if (res?.token) {
        if (window.fynncloud.context) window.fynncloud.context.token = res.token;
        return res.token;
      }
      return null;
    }

    function getApiBase() {
      if (window.fynncloud?.context?.apiBase) return window.fynncloud.context.apiBase;
      return window.location.origin;
    }

    async function api(path, init = {}) {
      const token = await getAppToken();
      if (!token) throw new Error('Missing app session token');
      const res = await fetch(`${getApiBase()}${path}`, {
        ...init,
        headers: { Authorization: `Bearer ${token}`, ...init.headers }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res;
    }

    async function loadDiagram() {
      loading = true;
      try {
        const res = await api(`/api/files/${fileId}/download`);
        const text = await res.text();
        currentXml = text.trim() ? text : BLANK_DIAGRAM;
      } catch (err) {
        console.error('Failed to load diagram:', err);
        toast('Could not load the diagram', 'error');
        loadingEl.textContent = 'Could not load the diagram.';
        return;
      } finally {
        loading = false;
      }
      dispatchToDrawio();
    }

    function dispatchToDrawio() {
      if (!drawioReady || currentXml === null || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({
        action: 'load',
        autosave: isReadOnly ? 0 : 1,
        xml: currentXml,
        title: fileName,
        dark: document.documentElement.classList.contains('dark') ? 1 : 0
      }), '*');
      loadingEl.classList.add('hidden');
    }

    async function writeFile(xml) {
      const body = new TextEncoder().encode(xml);
      const init = await (await api('/api/files/multipart/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fileID: fileId,
          filename: fileName,
          contentType: 'application/xml',
          totalSize: body.byteLength
        })
      })).json();

      const sessionHeaders = { Authorization: `Bearer ${init.token}` };
      const base = `${getApiBase()}/api/files/multipart/${init.sessionID}`;
      const parts = [];
      const chunk = Math.max(1, init.maxChunkSize);
      for (let offset = 0, n = 1; offset < body.byteLength; offset += chunk, n++) {
        const res = await fetch(`${base}/part/${n}`, {
          method: 'PUT',
          headers: sessionHeaders,
          body: body.slice(offset, offset + chunk)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        parts.push(await res.json());
      }
      const done = await fetch(`${base}/complete`, {
        method: 'POST',
        headers: { ...sessionHeaders, 'Content-Type': 'application/json' },
        body: JSON.stringify({ parts })
      });
      if (!done.ok) throw new Error(`HTTP ${done.status}`);
    }

    async function save(xml, isAutosave) {
      if (isReadOnly) return;
      currentXml = xml;
      if (isSaving) {
        queuedXml = xml;
        return;
      }
      isSaving = true;
      try {
        let next = xml;
        while (next) {
          queuedXml = null;
          await writeFile(next);
          next = queuedXml;
        }
        status('Saved to FynnCloud');
        if (!isAutosave) toast(`Saved "${fileName}"`, 'success');
      } catch (err) {
        console.error('Failed to save diagram:', err);
        status('Save failed', true);
        toast(`Failed to save: ${err.message}`, 'error');
      } finally {
        isSaving = false;
      }
    }

    function status(message, modified = false) {
      iframe.contentWindow?.postMessage(JSON.stringify({ action: 'status', message, modified }), '*');
    }

    function toast(message, type) {
      window.fynncloud?.showToast?.(message, type);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== iframe.contentWindow || typeof event.data !== 'string') return;
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }

      switch (msg.event) {
        case 'configure':
          iframe.contentWindow.postMessage(JSON.stringify({ action: 'configure', config: DRAWIO_CONFIG }), '*');
          break;
        case 'init':
          drawioReady = true;
          dispatchToDrawio();
          break;
        case 'save':
        case 'autosave':
          if (!isReadOnly && msg.xml) save(msg.xml, msg.event === 'autosave');
          break;
        case 'exit':
          window.fynncloud?.close?.();
          break;
      }
    });

    function applyTheme(theme) {
      if (!theme) return;
      const isDarkMode = theme === 'dark';
      document.documentElement.classList.toggle('dark', isDarkMode);
      if (drawioReady && iframe.contentWindow) {
        iframe.contentWindow.postMessage(JSON.stringify({
          action: 'invokeAction',
          actionName: isDarkMode ? 'darkMode' : 'lightMode'
        }), '*');
      }
    }

    readonlyBarEl.classList.toggle('visible', isReadOnly);

    if (window.fynncloud) {
      window.fynncloud.init();

      window.fynncloud.on('init', (ctx) => {
        if (ctx.theme) applyTheme(ctx.theme);
        applyReadOnlyMode(detectReadOnly(ctx));
        const target = filesFrom(ctx) || (fileId ? { id: fileId, name: fileName } : null);
        if (target) setFile(target.id, target.name);
      });

      window.fynncloud.on('fileAction', (payload) => {
        applyReadOnlyMode(detectReadOnly(payload));
        const target = filesFrom(payload);
        if (target) setFile(target.id, target.name);
      });

      window.fynncloud.on('themeChange', ({ theme }) => {
        applyTheme(theme);
      });

      window.fynncloud.on('tokenError', ({ reason }) => {
        if (isReadOnly) return;
        status('Session expired - changes can no longer be saved', true);
        toast(`Session could not be renewed: ${reason}. Copy your work or reopen the file.`, 'error');
      });
    } else {
      setFile(fileId, fileName);
    }

    iframe.src = buildEditorUrl(isReadOnly);
  </script>
</body>
</html>
